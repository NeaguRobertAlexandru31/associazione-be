  # ═══════════════════════════════════════════════════════════════════
  # EVENTS
  # ═══════════════════════════════════════════════════════════════════
  /events:
    get:
      tags: [Events]
      summary: Lista eventi (pubblico)
      description: Tutti gli eventi ordinati per data. Non richiede autenticazione.
      responses:
        '200':
          description: Array di eventi
    post:
      tags: [Events]
      summary: Crea evento (ADMIN)
      description: |
        Le immagini devono essere già caricate tramite `POST /uploads/events`
        e i relativi URL passati in `images` e `cover`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDto'
      responses:
        '201':
          description: Evento creato

  /events/{slug}:
    get:
      tags: [Events]
      summary: Dettaglio evento per slug (pubblico)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: serata-culturale-2025
      responses:
        '200':
          description: Dati evento
        '404':
          description: Evento non trovato

  /events/{id}:
    delete:
      tags: [Events]
      summary: Elimina evento (ADMIN)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID evento (cuid)
      responses:
        '200':
          description: Evento eliminato

  # ═══════════════════════════════════════════════════════════════════
  # ARTICLES
  # ═══════════════════════════════════════════════════════════════════
  /articles:
    get:
      tags: [Articles]
      summary: Lista articoli (pubblico)
      description: Tutti gli articoli ordinati per data di creazione (più recenti prima).
      responses:
        '200':
          description: Array di articoli
    post:
      tags: [Articles]
      summary: Crea articolo (ADMIN)
      description: |
        Il contenuto è strutturato in blocchi: ogni blocco ha `paragraph` (obbligatorio),
        `subtitle` e `image` opzionali. Gli URL immagine vanno caricati prima
        tramite `POST /uploads/articles`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleDto'
      responses:
        '201':
          description: Articolo creato
    delete:
      tags: [Articles]
      summary: Elimina multipli articoli (ADMIN)
      description: Elimina più articoli in una sola chiamata passando un array di ID.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  example: ["clx1abc123", "clx2def456"]
      responses:
        '200':
          description: Articoli eliminati

  /articles/{id}:
    get:
      tags: [Articles]
      summary: Dettaglio articolo (pubblico)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dati articolo
        '404':
          description: Articolo non trovato
    delete:
      tags: [Articles]
      summary: Elimina articolo singolo (ADMIN)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Articolo eliminato

  # ═══════════════════════════════════════════════════════════════════
  # PROJECTS
  # ═══════════════════════════════════════════════════════════════════
  /projects:
    get:
      tags: [Projects]
      summary: Lista progetti (pubblico)
      responses:
        '200':
          description: Array di progetti
    post:
      tags: [Projects]
      summary: Crea progetto (ADMIN)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: Progetto creato
    delete:
      tags: [Projects]
      summary: Elimina multipli progetti (ADMIN)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  example: ["clxaaa111", "clxbbb222"]
      responses:
        '200':
          description: Progetti eliminati

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Dettaglio progetto (pubblico)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dati progetto
        '404':
          description: Progetto non trovato
    patch:
      tags: [Projects]
      summary: Aggiorna progetto (ADMIN)
      description: PATCH parziale. Tipicamente usato per passare da `ongoing` a `completed`.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '200':
          description: Progetto aggiornato
    delete:
      tags: [Projects]
      summary: Elimina progetto singolo (ADMIN)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progetto eliminato

  # ═══════════════════════════════════════════════════════════════════
  # CONTACT
  # ═══════════════════════════════════════════════════════════════════
  /contact:
    post:
      tags: [Contact]
      summary: Invia messaggio di contatto (pubblico)
      description: |
        Il messaggio viene salvato nel DB e inviato via email tramite Resend.
        Non richiede autenticazione.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactDto'
      responses:
        '201':
          description: Messaggio inviato
    get:
      tags: [Contact]
      summary: Lista messaggi (ADMIN)
      description: Tutti i messaggi ricevuti ordinati per data. Richiede JWT.
      security:
        - Bearer: []
      responses:
        '200':
          description: Array di messaggi
    delete:
      tags: [Contact]
      summary: Elimina multipli messaggi (ADMIN)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  example: ["clx1msg111", "clx2msg222"]
      responses:
        '200':
          description: Messaggi eliminati

  /contact/unread-count:
    get:
      tags: [Contact]
      summary: Numero messaggi non letti (ADMIN)
      description: Usato per il badge di notifica nella dashboard.
      security:
        - Bearer: []
      responses:
        '200':
          description: Conteggio
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 3 }

  /contact/{id}/read:
    patch:
      tags: [Contact]
      summary: Segna messaggio come letto (ADMIN)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Messaggio marcato come letto

  /contact/{id}/reply:
    post:
      tags: [Contact]
      summary: Rispondi a un messaggio (ADMIN)
      description: |
        Invia una risposta via email (Resend) all'autore del messaggio.
        Nome e email del mittente vengono presi dall'utente autenticato.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyContactDto'
      responses:
        '201':
          description: Risposta inviata

  # ═══════════════════════════════════════════════════════════════════
  # UPLOADS (ADMIN)
  # ═══════════════════════════════════════════════════════════════════
  /uploads/events:
    post:
      tags: [Uploads]
      summary: Upload immagini eventi
      description: |
        Carica fino a 10 immagini. Le immagini vengono ridimensionate
        (max 1920px larghezza) e convertite in WebP (qualità 80) su Cloudflare R2.
        Restituisce gli URL da usare in `CreateEventDto.images` / `cover`.
        Campo form: `files`. Max 15 MB per file.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: URL immagini caricate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlsResponse'

  /uploads/articles:
    post:
      tags: [Uploads]
      summary: Upload immagini articoli
      description: |
        Come `/uploads/events`. URL da usare in `ArticleBlockDto.image`
        o `CreateArticleDto.cover`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: URL immagini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlsResponse'

  /uploads/projects:
    post:
      tags: [Uploads]
      summary: Upload immagini progetti
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: URL immagini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlsResponse'

  /uploads/settings:
    post:
      tags: [Uploads]
      summary: Upload immagine impostazioni sito
      description: |
        Carica 1 immagine (es. logo, banner). L'URL restituito va usato
        come valore in `PUT /site-settings/{key}`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 1
                  items: { type: string, format: binary }
      responses:
        '201':
          description: URL immagine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlsResponse'

  /uploads/placeholders:
    post:
      tags: [Uploads]
      summary: Upload immagine placeholder
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 1
                  items: { type: string, format: binary }
      responses:
        '201':
          description: URL placeholder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlsResponse'

  /uploads/avatar:
    post:
      tags: [Uploads]
      summary: Upload avatar socio (ADMIN)
      description: |
        Carica l'avatar di un socio. Ridimensionato a 400×400px, convertito in WebP.
        Campo form: `file` (singolo file, non array).
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: URL avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'

  # ═══════════════════════════════════════════════════════════════════
  # SITE SETTINGS
  # ═══════════════════════════════════════════════════════════════════
  /site-settings:
    get:
      tags: [Site Settings]
      summary: Tutte le impostazioni (pubblico)
      description: |
        Restituisce tutte le chiavi/valori del sito (nome, logo, colori, testi).
        Usato dal frontend al bootstrap per configurare la UI. Pubblico.
      responses:
        '200':
          description: Oggetto impostazioni

  /site-settings/{key}:
    put:
      tags: [Site Settings]
      summary: Aggiorna impostazione (ADMIN)
      description: |
        Imposta o aggiorna il valore di una chiave. Il valore è sempre una stringa.

        **Chiavi comuni:** `associationName`, `logoUrl`, `primaryColor`,
        `contactEmail`, `description`.
      security:
        - Bearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          example: associationName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, example: "Associazione Culturale XYZ" }
      responses:
        '200':
          description: Impostazione aggiornata

  # ═══════════════════════════════════════════════════════════════════
  # ACTIVITY
  # ═══════════════════════════════════════════════════════════════════
  /activity:
    get:
      tags: [Activity]
      summary: Log attività recenti
      description: |
        Ultime attività del sistema (iscrizioni, login, modifiche).
        Usato nel pannello di monitoraggio della dashboard. Richiede JWT.
      security:
        - Bearer: []
      responses:
        '200':
          description: Array di attività recenti
        '401':
          description: Token assente o non valido
